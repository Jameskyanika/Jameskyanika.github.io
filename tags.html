---
layout: default
title: Tags
permalink: /tags/
---

<h1>Blog Tags</h1>

{% assign sorted_tags = site.tags | sort %}

{% for tag in sorted_tags %}
  <section>
    <h2>{{ tag[0] }}</h2>

    <ul>
      {% for post in tag[1] %}
        <li>
          <a href="{{ post.url }}">{{ post.title }}</a>
          <small>— {{ post.date | date: "%d %B %Y" }}</small>
        </li>
      {% endfor %}
    </ul>
  </section>
{% endfor %}
